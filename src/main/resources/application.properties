spring.application.name=MovieUniverseHub

server.address=127.0.0.1
server.port=8081

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# The token stays on the server. Missing token does not block seed/database work.
tmdb.base-url=https://api.themoviedb.org/3
tmdb.api-token=${TMDB_API_TOKEN:}
tmdb.language=pt-PT
tmdb.connect-timeout=3s
tmdb.read-timeout=10s
server.error.include-message=never
server.error.include-stacktrace=never

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie
server.shutdown=graceful
spring.jackson.deserialization.accept-float-as-int=false
